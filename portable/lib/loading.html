<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U-Claw 正在启动…</title>
<!--
  启动首屏（移植自 v2 u-clawx 4.0 的 splash 思路）。
  双击启动脚本后立刻打开本页，给用户即时反馈，消除"黑窗假死"体感。
  本页每秒自查 gateway 是否就绪（fetch /ready）。

  首启时会轮询 Config Center 暴露的启动状态：离线 seed 需要数分钟，
  不能让用户只看到一个没有阶段变化的黑窗。网关 ready 后自动进入 Dashboard。

  网关端口在 Config Center 启动后才选择，避免两者抢占回退端口；
  启动器把选中的端口写入启动状态，页面据此开始轮询 /ready。
-->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.box {
  text-align: center;
  max-width: 460px;
  padding: 40px;
}
.logo { font-size: 64px; line-height: 1; margin-bottom: 18px; }
h1 { font-size: 1.7em; font-weight: 600; margin-bottom: 8px; }
.tip { opacity: .85; font-size: 1.02em; line-height: 1.6; margin-bottom: 28px; }
.spinner {
  width: 46px; height: 46px;
  margin: 0 auto 24px;
  border: 4px solid rgba(255,255,255,.25);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.bar {
  height: 6px; width: 100%;
  background: rgba(255,255,255,.2);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 14px;
}
.bar > i {
  display: block; height: 100%; width: 30%;
  background: #fff; border-radius: 999px;
  animation: slide 1.6s ease-in-out infinite;
}
@keyframes slide {
  0%   { margin-left: -30%; }
  100% { margin-left: 100%; }
}
.status { font-size: .95em; opacity: .9; min-height: 1.4em; }
.elapsed { font-size: .82em; opacity: .6; margin-top: 6px; }
.note {
  margin-top: 30px; font-size: .82em; opacity: .65; line-height: 1.6;
}
a.manual { color: #fff; text-decoration: underline; opacity: .9; }

/* —— 就绪后的选择页 —— */
</style>
</head>
<body>
  <div class="box">

    <!-- 启动中 -->
    <div class="loading-wrap">
      <div class="logo">🦞</div>
      <h1>U-Claw 正在启动</h1>
      <div class="tip">首次启动正在离线安装运行时，约需 3–5 分钟。<br>就绪后会自动进入 Dashboard。</div>
      <div class="spinner"></div>
      <div class="bar"><i></i></div>
      <div class="status" id="status">正在准备离线运行时…</div>
      <div class="elapsed" id="elapsed"></div>
      <div class="note">
        快速模式会在这台电脑的 %LOCALAPPDATA%\U-Claw\ 建约 850 MB 可重建缓存；<br>
        业务数据仍只在 U 盘，缓存可用 <code>uclaw runtime.host.purge --yes</code> 清理。<br>
        如果迟迟没反应，可先打开
        <a class="manual" id="manual" href="#">配置中心</a>。
      </div>
    </div>

  </div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var port = parseInt(params.get('port'), 10) || 0;
  var configPort = parseInt(params.get('configPort'), 10) || 18788;
  var token = params.get('token') || 'uclaw';
  var base = port ? 'http://127.0.0.1:' + port : '';
  var dashboard = base ? base + '/#token=' + encodeURIComponent(token) : '';
  var configCenter = 'http://127.0.0.1:' + configPort + '/';

  document.getElementById('manual').href = configCenter;

  var startedAt = Date.now();
  var ready = false;

  function fmt(ms) {
    var s = Math.floor(ms / 1000);
    return '已等待 ' + s + ' 秒';
  }

  function tickElapsed() {
    if (ready) return;
    document.getElementById('elapsed').textContent = fmt(Date.now() - startedAt);
  }
  setInterval(tickElapsed, 1000);
  tickElapsed();

  function showChoice() {
    if (ready || !dashboard) return;
    ready = true;
    document.getElementById('status').textContent = 'U-Claw 已就绪，正在进入 Dashboard…';
    location.replace(dashboard);
  }

  function setGatewayPort(nextPort) {
    if (!nextPort || nextPort === port) return;
    port = nextPort;
    base = 'http://127.0.0.1:' + port;
    dashboard = base + '/#token=' + encodeURIComponent(token);
  }

  var phaseText = {
    bootstrap: '正在校验并展开离线 Node…',
    'runtime-seed': '正在安装运行时（约 3–5 分钟）…',
    activating: '正在验证并切换运行时…',
    'starting-gateway': '正在启动 OpenClaw 网关…',
    failed: '启动失败，请查看启动窗口中的错误信息。'
  };

  var configCandidates = [];
  for (var candidate = 18788; candidate <= 18798; candidate++) configCandidates.push(candidate);

  function pollStartupStatus(index) {
    var current = configCandidates[index || 0];
    fetch('http://127.0.0.1:' + current + '/api/startup-status', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (status) {
        if (!status) throw new Error('status unavailable');
        configPort = current;
        configCenter = 'http://127.0.0.1:' + configPort + '/';
        document.getElementById('manual').href = configCenter;
        setGatewayPort(parseInt(status.gateway_port, 10));
        var text = status.message || phaseText[status.phase];
        if (text) document.getElementById('status').textContent = text;
      })
      .catch(function () {
        if ((index || 0) + 1 < configCandidates.length) pollStartupStatus((index || 0) + 1);
      });
  }
  setInterval(pollStartupStatus, 1000);
  pollStartupStatus();

  function poll() {
    if (ready) return;
    if (!base) { setTimeout(poll, 500); return; }
    // /ready 就绪即显示选择页。no-cors 下拿不到 status，但 fetch 成功 resolve 就说明端口活了。
    fetch(base + '/ready', { mode: 'no-cors', cache: 'no-store' })
      .then(function () { showChoice(); })
      .catch(function () {
        // 端口还没起，继续等
        setTimeout(poll, 1000);
      });
  }
  poll();

  // 兜底：5 分钟还没起来，提示去控制台
  setTimeout(function () {
    if (!ready) {
      document.getElementById('status').innerHTML =
        '启动较慢，可先打开 <a class="manual" href="' + configCenter + '">配置中心</a> 检查';
    }
  }, 300000);
})();
</script>
</body>
</html>
