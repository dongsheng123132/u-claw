name: Windows engine acceptance

# Runs the v2.5 engine-on-host acceptance on a clean Windows Server runner:
# cold first run, warm reuse, forced drive fallback, damaged archive, interrupted
# install, legacy loose tree. No USB stick on a runner, so this validates the
# resolution/install/fallback logic; exFAT behaviour is covered on real hardware.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "release = install from the latest release zip; setup = build the runtime in the runner"
        required: false
        default: "release"
  pull_request:
    paths:
      - "tools/win-accept.ps1"
      - ".github/workflows/win-acceptance.yml"
      - "portable/lib/engine-host.ps1"
      - "portable/lib/engine-host.sh"
      - "portable/Windows-Start.bat"
  push:
    branches: [main]
    paths:
      - "tools/win-accept.ps1"
      - ".github/workflows/win-acceptance.yml"
      - "portable/lib/engine-host.ps1"
      - "portable/lib/engine-host.sh"
      - "portable/Windows-Start.bat"

jobs:
  accept:
    name: Engine acceptance (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner facts
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          "PSVersion      : $($PSVersionTable.PSVersion)"
          "OS             : $((Get-CimInstance Win32_OperatingSystem).Caption)"
          "FreeOnC_GB     : $([math]::Round((Get-PSDrive C).Free/1GB,1))"
          "NodeOnRunner   : $(node --version)"
          "TarOnRunner    : $(tar --version | Select-Object -First 1)"

      - name: Optionally build the runtime locally (setup.ps1)
        if: ${{ github.event.inputs.source == 'setup' }}
        shell: pwsh
        run: |
          $root = 'D:\src'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item -Recurse -Force .\portable\* $root\
          Set-Location $root
          .\setup.ps1 2>&1 | Tee-Object -FilePath D:\setup.log | Select-Object -Last 20
          "runtime_ready=$([bool](Test-Path "$root\app\core\node_modules\openclaw\openclaw.mjs"))"
          if (-not (Test-Path "$root\app\core\node_modules\openclaw\openclaw.mjs")) { throw 'setup.ps1 did not produce a runtime' }

      - name: Run the acceptance
        id: accept
        continue-on-error: true
        shell: pwsh
        env:
          UCLAW_ACCEPT_SOURCE: ${{ github.event.inputs.source }}
          # The harness stages the skeleton from refs/heads/<ref>; without this it
          # always pulled main, so a PR touching engine-host.ps1 was validated
          # against main's copy instead of its own.
          UCLAW_ACCEPT_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $source = if ($env:UCLAW_ACCEPT_SOURCE -eq 'setup') { 'D:\src' } else { '' }
          $ref = $env:UCLAW_ACCEPT_REF
          if (-not $ref) { $ref = 'main' }
          Write-Host "acceptance ref: $ref"
          $args = @('-NoProfile','-ExecutionPolicy','Bypass','-File','tools\win-accept.ps1','-Root','D:\accept','-RepoRef',$ref)
          if ($source) { $args += @('-SourceApp', $source) }
          & powershell @args
          if (-not (Test-Path 'D:\accept\accept-summary.json')) { throw 'acceptance produced no summary' }
          $summary = Get-Content 'D:\accept\accept-summary.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          "---- SUMMARY ----"
          $summary | ConvertTo-Json -Depth 6
          "failures=$($summary.failures)"
          if ($summary.failures -ne 0) { exit 1 }

      - name: Diagnose the launcher (why it exits early)
        if: always()
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $stick = 'D:\accept\stick'
          if (-not (Test-Path $stick)) { "no stick staged, skipping"; exit 0 }
          $env:UCLAW_HEADLESS = '1'
          $env:UCLAW_ENGINE_MODE = 'auto'
          "---- resolver (direct) ----"
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$stick\lib\engine-host.ps1" "$stick\." 2>&1 | Out-String
          # Do not run the launcher here: it starts a gateway and would block the job.
          # The acceptance step already ran it six times with a bounded wait.

          "---- stick layout ----"
          Get-ChildItem $stick | Select-Object Name, Length | Format-Table -AutoSize | Out-String
          "---- runtime-requirements against the installed engine ----"
          $engine = Get-ChildItem "$env:LOCALAPPDATA\U-Claw\*\engine\2026.10.9" -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($engine) {
            "engine=$($engine.FullName)"
            "has_pin=$([bool](Test-Path (Join-Path $engine.FullName 'OPENCLAW_VERSION')))"
            "has_marker=$([bool](Test-Path (Join-Path $engine.FullName 'app\core\.uclaw-runtime-platform')))"
            if (Test-Path (Join-Path $engine.FullName 'app\core\.uclaw-runtime-platform')) {
              "marker=$((Get-Content (Join-Path $engine.FullName 'app\core\.uclaw-runtime-platform') -Raw).Trim())"
            }
            if (Test-Path (Join-Path $engine.FullName 'app\core\node_modules\openclaw\package.json')) {
              "core_version=$((Get-Content (Join-Path $engine.FullName 'app\core\node_modules\openclaw\package.json') -Raw | ConvertFrom-Json).version)"
            }
            $node = Join-Path $engine.FullName 'app\runtime\node-win-x64\node.exe'
            if (Test-Path $node) {
              "requirements=$(& $node "$stick\lib\runtime-requirements.mjs" $engine.FullName 2>&1)"
            }
          }
          "---- engine cache ----"
          Get-ChildItem "$env:LOCALAPPDATA\U-Claw" -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Select-Object FullName | Format-Table -AutoSize | Out-String

      - name: Fail if the acceptance reported failures
        if: ${{ steps.accept.outcome == 'failure' }}
        shell: pwsh
        run: |
          "acceptance step failed (see summary above)"
          exit 1

      - name: Upload logs and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-acceptance
          path: |
            D:\accept\accept-summary.json
            D:\accept\accept.log
            D:\accept\run-*.log
            D:\accept\run-*.log.err
          if-no-files-found: warn
