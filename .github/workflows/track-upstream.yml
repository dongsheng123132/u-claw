name: Track OpenClaw upstream

# 自动跟踪 OpenClaw 上游更新（借鉴 agentkernel/openclaw-desktop 的 pin 思路，
# 但补上了它没做的最后一步：定时检测 + 自动 bump + 自动打 tag → 自动发版）。
#
# 工作原理：
#   1. 每天 cron 跑 `npm view openclaw version` 拿上游 npm 最新版
#   2. 和仓库里的 OPENCLAW_VERSION（pin）比对
#   3. 上游更新了 → 改 OPENCLAW_VERSION（根 + portable/）、bump 壳版本 patch、
#      commit、push 新 tag v<壳版本>
#   4. push tag 触发 release.yml → 自动构建 Win/Mac 便携版+桌面版并发布 Release
#
# 设计原则：
#   - 幂等：上游没新版就什么都不做，安静退出
#   - 可手动：workflow_dispatch 支持手动触发、强制指定上游版本、dry-run 只看不改
#   - 单一可信源：OPENCLAW_VERSION 是上游 pin，u-claw-app/package.json 是壳版本

on:
  schedule:
    # 每天 UTC 01:00（北京时间 09:00）检查一次
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: '强制使用的上游 OpenClaw 版本（留空=用 npm latest）'
        required: false
        default: ''
      dry_run:
        description: '只检测不改动（true/false）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  track:
    name: Check upstream & auto-bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史才能正确打 tag / 读已有 tag
          fetch-depth: 0
          # 半自动模式（默认）：用 GITHUB_TOKEN push tag。GitHub 防递归机制下
          # 自动推的 tag 不会触发 release.yml，所以需到 Actions 手动点一次 Run release。
          # 想升级成全自动：去仓库 Settings → Secrets 加一个 RELEASE_PAT（个人访问令牌，
          # repo 权限），本行会自动优先用它 push，tag 即可自动触发发版。
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve upstream OpenClaw version
        id: upstream
        run: |
          force="${{ github.event.inputs.force_version }}"
          if [ -n "$force" ]; then
            latest="${force#v}"
            echo "强制指定上游版本: $latest"
          else
            latest="$(npm view openclaw version --registry=https://registry.npmmirror.com 2>/dev/null | tr -d '[:space:]')"
            # npmmirror 偶尔缓存陈旧，官方源兜底取较大值
            official="$(npm view openclaw version 2>/dev/null | tr -d '[:space:]')"
            if [ -n "$official" ] && [ "$official" != "$latest" ]; then
              # 取版本号较大的那个（npmmirror 缓存滞后时用官方源）
              latest="$(printf '%s\n%s\n' "$latest" "$official" | sort -V | tail -1)"
            fi
            echo "npm latest openclaw: $latest"
          fi
          if [ -z "$latest" ]; then
            echo "::error::无法获取上游 openclaw 版本（npm view 失败）"
            exit 1
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Read current pin
        id: current
        run: |
          pinned="$(tr -d '[:space:]' < OPENCLAW_VERSION)"
          shell_ver="$(node -p "require('./u-claw-app/package.json').version")"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "shell_ver=$shell_ver" >> "$GITHUB_OUTPUT"
          echo "当前 pin: $pinned | 壳版本: $shell_ver"

      - name: Decide whether to bump
        id: decide
        run: |
          latest="${{ steps.upstream.outputs.latest }}"
          pinned="${{ steps.current.outputs.pinned }}"
          if [ "$latest" = "$pinned" ]; then
            echo "✅ 已是最新（pin=$pinned），无需发版。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 只在 latest 严格 > pinned 时发版（避免上游撤版导致回退）
          newer="$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)"
          if [ "$newer" != "$latest" ]; then
            echo "⚠️ npm latest ($latest) 不比当前 pin ($pinned) 新，跳过。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "🆕 发现上游新版: $pinned → $latest"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # ── 跟随上游之前，先确认我们随包发的 Node 还跑得动它 ──────────────────
      #
      # 2026-08-23 的教训：openclaw 2026.7.1 把 engines 从 >=22.19.0 提到
      # >=22.22.3，而本仓一直 pin 着 Node v22.22.1。这个 workflow 照常自动
      # bump、自动打 tag、自动发版，于是 v2.1.15/16/17 三个下载包的网关全都
      # 起不来（客户端报 "OpenClaw exited unexpectedly (code 1)"），
      # 而这里一路绿灯——因为它只比对版本号，从不看 engines。
      #
      # 现在：上游提了 Node 要求而我们没跟上，就**停在这里不发版**，
      # 让人来决定升 Node 还是暂缓跟随。宁可不发，也不发一个开不了机的包。
      - name: Guard —— 新版 OpenClaw 的 engines 我们满足吗
        if: steps.decide.outputs.changed == 'true'
        run: |
          latest="${{ steps.upstream.outputs.latest }}"

          # 内置 Node 的真相源：portable/setup.bat（其余脚本由单测断言与它一致）
          node_version=$(grep -oE 'NODE_VERSION=v[0-9]+\.[0-9]+\.[0-9]+' portable/setup.bat | head -1 | cut -d= -f2)
          if [ -z "$node_version" ]; then
            echo "::error::从 portable/setup.bat 里读不出 Node 版本，抓取规则可能失效了"
            exit 1
          fi

          engines=$(npm view "openclaw@$latest" engines.node 2>/dev/null)
          if [ -z "$engines" ]; then
            echo "::warning::拿不到 openclaw@$latest 的 engines，跳过本检查（release.yml 里还有一道产物闸门兜底）"
            exit 0
          fi

          echo "上游新版 openclaw $latest 要求 Node: $engines"
          echo "我们内置的 Node:                    $node_version"

          node -e '
            const [ver, range] = [process.argv[1], process.argv[2]];
            const p = v => { const m = String(v).replace(/^v/,"").match(/^(\d+)\.(\d+)\.(\d+)/); return m && {ma:+m[1],mi:+m[2],pa:+m[3]}; };
            const cmp = (a,b) => a.ma-b.ma || a.mi-b.mi || a.pa-b.pa;
            const v = p(ver);
            const ok = String(range).split("||").some(br =>
              br.trim().split(/\s+/).filter(Boolean).every(c => {
                const m = c.match(/^(>=|<=|>|<|=)?\s*v?(\d+(?:\.\d+){0,2})$/);
                if (!m) return false;
                const t = m[2].split(".").map(Number);
                const r = cmp(v, {ma:t[0], mi:t[1]??0, pa:t[2]??0});
                const op = m[1] || "=";
                return op===">=" ? r>=0 : op===">" ? r>0 : op==="<=" ? r<=0 : op==="<" ? r<0 : r===0;
              })
            );
            if (!ok) {
              console.error(`::error::上游 openclaw ${process.env.LATEST} 要求 Node ${range}，但我们随包发的是 ${ver}——直接跟随会发出一个开不了机的包。请先把所有脚本里 pin 的 Node 一起升上去（见 tests/node-version-satisfies-openclaw.test.mjs 里的清单），再手动触发本 workflow。`);
              process.exit(1);
            }
            console.log(`✅ ${ver} 满足 ${range}，可以安全跟随`);
          ' "$node_version" "$engines"
        env:
          LATEST: ${{ steps.upstream.outputs.latest }}

      - name: Compute next shell version (patch bump)
        if: steps.decide.outputs.changed == 'true'
        id: nextver
        run: |
          cur="${{ steps.current.outputs.shell_ver }}"
          IFS='.' read -r MA MI PA <<< "$cur"
          PA=$((PA + 1))
          next="${MA}.${MI}.${PA}"
          echo "壳版本 bump: $cur → $next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Apply changes (pin + version files)
        if: steps.decide.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          latest="${{ steps.upstream.outputs.latest }}"
          next="${{ steps.nextver.outputs.next }}"

          # 1) 更新上游 pin（根 + portable/ 两份保持一致）
          printf '%s\n' "$latest" > OPENCLAW_VERSION
          printf '%s\n' "$latest" > portable/OPENCLAW_VERSION

          # 2) bump 壳版本（package.json）。release.yml 仍会从 tag 同步，
          #    这里写一份让 main 分支也保持一致。
          node -e "const f='u-claw-app/package.json';const p=require('./'+f);p.version='$next';require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')"

          echo "已写入: OPENCLAW_VERSION=$latest, 壳版本=$next"

      - name: Commit, tag & push
        if: steps.decide.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          latest="${{ steps.upstream.outputs.latest }}"
          next="${{ steps.nextver.outputs.next }}"

          git config user.name  "u-claw-bot"
          git config user.email "bot@u-claw.org"

          git add OPENCLAW_VERSION portable/OPENCLAW_VERSION u-claw-app/package.json
          git commit -m "chore(upstream): 跟随 OpenClaw $latest，发布 v$next

          自动跟踪上游：OpenClaw npm latest 升到 $latest，
          自动 bump 壳版本到 $next 并打 tag 触发发版。"

          git push origin HEAD:main

          # 打 tag 触发 release.yml
          git tag "v$next"
          git push origin "v$next"

          echo "✅ 已推送 v$next，release.yml 将自动构建并发布。"

      - name: Dry-run summary
        if: steps.decide.outputs.changed == 'true' && github.event.inputs.dry_run == 'true'
        run: |
          echo "🔍 DRY RUN — 不改动。"
          echo "若执行将：OPENCLAW_VERSION ${{ steps.current.outputs.pinned }} → ${{ steps.upstream.outputs.latest }}，发布 v${{ steps.nextver.outputs.next }}"
