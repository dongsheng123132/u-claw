name: Track OpenClaw upstream
# Discovery only. Updating the pin, native dependencies and patches requires acceptance.
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - name: Report upstream version without publishing
        shell: bash
        run: |
          set -euo pipefail
          pinned=$(tr -d '[:space:]' < OPENCLAW_VERSION)
          latest=$(npm view openclaw version --registry=https://registry.npmjs.org --fetch-timeout=30000)
          echo "Bundled OpenClaw: $pinned; upstream: $latest" >> "$GITHUB_STEP_SUMMARY"
          if [ "$pinned" != "$latest" ]; then
            echo "::warning::New OpenClaw $latest requires Node, native dependency, patch, and physical NTFS acceptance before release."
          fi
