name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build as a draft'
        required: true
permissions:
  contents: write
jobs:
  portable-windows-full:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build on Windows with locked native dependencies
        shell: pwsh
        run: ./tools/build-windows-release.ps1 -OutputDir "${{ runner.temp }}/uclaw-release"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-windows-full
          path: |
            ${{ runner.temp }}/uclaw-release/*.zip
            ${{ runner.temp }}/uclaw-release/*.sha256
      - name: Create draft only; physical NTFS acceptance precedes publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag='v'+(Get-Content VERSION -Raw).Trim()
          $existing = gh release view $tag --json isDraft 2>$null | ConvertFrom-Json
          if ($existing -and -not $existing.isDraft) { throw 'Refusing to overwrite a published release' }
          if (-not $existing) { gh release create $tag --verify-tag --draft --title "U-Claw $tag" --notes-file "docs/release-notes/$tag.md" }
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
          $assets=(Get-ChildItem "${{ runner.temp }}/uclaw-release/*" -Include '*.zip','*.sha256').FullName
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed' }
