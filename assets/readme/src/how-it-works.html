<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body { height: 400px; padding: 48px 64px; }
h2 { font-size: 34px; font-weight: 800; }
.sub { font-size: 16px; margin-top: 8px; }
.row { display: flex; align-items: stretch; margin-top: 34px; }
.step { flex: 1; padding: 26px 24px; }
.arrow { width: 36px; display: flex; align-items: center; justify-content: center; color: #3a4252; font-size: 22px; }
.n { font-size: 14px; font-weight: 700; color: #ff6b35; letter-spacing: 1px; }
.t { font-size: 24px; font-weight: 700; margin-top: 14px; }
.d { font-size: 14px; line-height: 1.8; margin-top: 12px; color: #9aa4b2; }
code { font-family: Consolas, monospace; font-size: 13px; color: #ffb08f; background: rgba(255,107,53,.08); padding: 1px 6px; border-radius: 5px; }
</style></head><body><div class="glow"></div>
<h2>从下载到开始对话</h2>
<p class="sub muted">Windows 下载完整包即用；Mac 首次启动自动补齐运行时。</p>
<div class="row">
  <div class="step card"><div class="n">01</div><div class="t">下载 / 拷贝</div><div class="d">从 Releases 下载便携版<br>解压到 U 盘（建议 NTFS）</div></div>
  <div class="arrow">→</div>
  <div class="step card"><div class="n">02</div><div class="t">双击启动</div><div class="d"><code>Windows-Start.bat</code><br><code>Mac-Start.command</code></div></div>
  <div class="arrow">→</div>
  <div class="step card"><div class="n">03</div><div class="t">选模型、填 Key</div><div class="d">虾盘云 · DeepSeek · Kimi<br>通义 · 智谱 · 本地 Ollama</div></div>
  <div class="arrow">→</div>
  <div class="step card"><div class="n">04</div><div class="t">开始工作</div><div class="d">浏览器 Dashboard 对话<br>或接 QQ / 飞书 / 钉钉</div></div>
</div>
</body></html>
